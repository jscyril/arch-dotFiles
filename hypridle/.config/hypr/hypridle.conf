$lock_cmd = qs -c drift ipc call drift lock || /home/jscyril/.local/share/quickshell-lockscreen/lock.sh
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    # before_sleep_cmd = loginctl lock-session
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = niri msg action power-on-monitors           # to turn on display after sleep
}

listener {
    timeout = 300 # 5mins
    #on-timeout = loginctl lock-session
    on-timeout = $lock_cmd
}

listener {
    timeout = 420 # 7mins
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

listener {
    timeout = 540 # 9mins
    on-timeout = $suspend_cmd
}
